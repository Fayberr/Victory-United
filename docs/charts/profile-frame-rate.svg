<svg xmlns="http://www.w3.org/2000/svg" width="880" height="346" viewBox="0 0 880 346" role="img" aria-labelledby="title description">
  <title id="title">Frame rate in the world</title>
  <desc id="description">Series X median 14.3 fps, 1% low 3.5, p10 to p90 13.6 to 14.7. Series S median 20.8 fps, 1% low 8.7, p10 to p90 19.2 to 21.8. The target is 30 fps.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1">
      <stop stop-color="#252939"/>
      <stop offset="1" stop-color="#151824"/>
    </linearGradient>

  </defs>
  <style>
    text { font-family: system-ui, 'Segoe UI', sans-serif; font-variant-numeric: tabular-nums; }
